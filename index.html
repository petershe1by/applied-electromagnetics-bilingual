<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152c41"><title>应用电磁学 · 双语书房</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><button id="menu" class="iconbutton" aria-label="显示目录" aria-expanded="false">☰</button><a href="./" class="brand"><span class="monogram">EM</span><span>应用电磁学<span class="brand-sub">第8版 · 中英对照</span></span></a><span id="connection" class="connection">正在准备</span><button id="offlineOpen" class="offlinebutton">离线阅读</button></header>
<aside id="sidebar" aria-label="书籍目录"><div class="sidebar-heading"><span>书籍目录</span><button id="closeMenu" aria-label="收起目录">×</button></div><nav id="contents"></nav><div class="edition"><span>章节总结复核修订版</span><p>译文仍在校对中。学习时请结合英文原文核对。</p></div></aside>
<main><div class="toolbar"><div class="view-switch" role="group" aria-label="阅读语言"><button data-view="both" aria-pressed="true">中英对照</button><button data-view="zh" aria-pressed="false">中文</button><button data-view="en" aria-pressed="false">英文</button></div><div class="zoom"><button id="zoomOut" aria-label="缩小">−</button><button id="fit" title="恢复适合宽度">适合宽度</button><button id="zoomIn" aria-label="放大">＋</button></div></div>
<div id="paperArea" class="paper-area"><div id="loading" class="loading" role="status">正在打开电子书…</div><div id="error" class="error" hidden><strong>这一页暂时无法打开</strong><p id="errorText"></p><button id="retry">重新打开</button></div><div id="paper" class="paper" hidden><canvas id="pageCanvas" aria-label="电子书页面"></canvas></div></div>
<footer class="pagination"><button id="prev" aria-label="上一页">← 上一页</button><form id="pageForm"><label for="pageNumber">第</label><input id="pageNumber" type="number" min="1" max="490" inputmode="numeric" value="1" aria-label="跳转到页码"><span>/ 490 页</span><button type="submit" class="jump">跳转</button></form><button id="next" aria-label="下一页">下一页 →</button><div class="progress-track"><div id="readingProgress"></div></div></footer></main>
<dialog id="offlineDialog"><div class="dialog-title"><h2>把书带到离线环境</h2><button id="closeOffline" aria-label="关闭">×</button></div><p>先联网保存全书。下载完成后，在<strong>同一浏览器</strong>打开此链接即可阅读；也可以用浏览器的“安装应用”或“添加到主屏幕”。</p><div class="cache-summary"><strong id="cacheCount">正在检查缓存…</strong><span id="cacheSize">书籍约83 MB，另含阅读器资源</span></div><progress id="downloadProgress" max="17" value="0"></progress><p id="downloadStatus" role="status" aria-live="polite"></p><div class="dialog-actions"><button id="downloadBook" class="primary">下载全书供离线阅读</button><button id="cancelDownload" hidden>暂停下载</button><button id="clearCache">清除离线书籍</button></div><p class="storage-note">阅读位置会自动保存。清理浏览器数据或使用无痕模式可能导致离线内容丢失；下载时请保持此页面打开。</p></dialog>
<script type="module" src="./app.mjs"></script></body></html>
